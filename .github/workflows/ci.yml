name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Lets the release workflow gate publication on the full test suite.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build and test with a supported Go release; go.mod only states the minimum.
  GO_VERSION: '1.27.x'

jobs:
  backend-tests:
    name: Backend Go Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Go Tests with Race Detector
        # Cover only ./internal/... — cmd/server is a thin entrypoint with no tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./internal/...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

      - name: Govulncheck (Go stdlib & modules)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-tests:
    name: Frontend Vue 3 Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit Production Dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

      - name: Lint Frontend (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend (Vite)
        working-directory: frontend
        run: npm run build

  e2e-tests:
    name: End-to-end Tests (WebKit iPhone, Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps webkit chromium

      - name: Run Playwright Tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, e2e-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: icsexplorer:test
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'icsexplorer:test'
          format: 'table'
          # Fail the pipeline on fixable HIGH/CRITICAL vulnerabilities.
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
