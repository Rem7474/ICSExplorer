name: Release & Multi-Arch Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    name: Automated Versioning (Release Please)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-docker:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    needs: [release-please]
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name || github.ref_name }}
            type=raw,value=latest,enable=true

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-binaries:
    name: Build Standalone Binaries
    runs-on: ubuntu-latest
    needs: [release-please]
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

      - name: Setup Node.js & Build Frontend
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Matrix Binaries
        run: |
          mkdir -p dist
          TAG_NAME="${{ needs.release-please.outputs.tag_name || github.ref_name || 'v2.0.1' }}"
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.version=$TAG_NAME -X main.buildTime=$BUILD_TIME"
          
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/icsexplorer-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/icsexplorer-linux-arm64 ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/icsexplorer-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/icsexplorer-darwin-arm64 ./cmd/server
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/icsexplorer-windows-amd64.exe ./cmd/server

          cd dist && sha256sum * > checksums.txt

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          files: |
            dist/*
