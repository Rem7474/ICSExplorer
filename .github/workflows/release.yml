name: Release & Multi-Arch Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nom du tag (ex: v2.0.3)'
        required: false

permissions:
  contents: write
  packages: write

jobs:
  publish-docker:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag_name || github.ref_name }}
            BUILD_TIME=${{ steps.meta.outputs.build_date }}

  build-binaries:
    name: Build Standalone Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js & Build Frontend
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          cd frontend
          npm ci
          VITE_APP_VERSION="${{ inputs.tag_name || github.ref_name }}" npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Matrix Binaries
        run: |
          mkdir -p dist
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.version=$TAG_NAME -X main.buildTime=$BUILD_TIME"
          
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/icsexplorer-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/icsexplorer-linux-arm64 ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/icsexplorer-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/icsexplorer-darwin-arm64 ./cmd/server
          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/icsexplorer-windows-amd64.exe ./cmd/server

          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist/*
          generate_release_notes: true
