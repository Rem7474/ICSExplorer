name: Release & Multi-Arch Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag existant à (re)publier (ex: v2.0.3)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.x'
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  # Never publish an image or binaries that did not pass the full test suite.
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  publish-docker:
    name: Build & Push Multi-Arch Docker Image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` is added automatically for non-prerelease semver tags.
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            BUILD_TIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}

  build-binaries:
    name: Build Standalone Binaries
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          VITE_APP_VERSION="$RELEASE_TAG" npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build & Package Binaries
        # Each archive ships the binary next to frontend/dist, which is where
        # the server looks for the web UI by default (STATIC_DIR=frontend/dist).
        run: |
          set -euo pipefail
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.version=$RELEASE_TAG -X main.buildTime=$BUILD_TIME"
          mkdir -p dist

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*}; GOARCH=${target#*/}
            NAME="icsexplorer-${RELEASE_TAG}-${GOOS}-${GOARCH}"
            EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"

            STAGE="build/$NAME"
            mkdir -p "$STAGE/frontend"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags="$LDFLAGS" -o "$STAGE/icsexplorer$EXT" ./cmd/server
            cp -r frontend/dist "$STAGE/frontend/dist"
            cp LICENSE README.md .env.example "$STAGE/"

            if [ "$GOOS" = "windows" ]; then
              (cd build && zip -qr "../dist/$NAME.zip" "$NAME")
            else
              tar -C build -czf "dist/$NAME.tar.gz" "$NAME"
            fi
          done

          cd dist && sha256sum -- *.tar.gz *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*
          generate_release_notes: true
