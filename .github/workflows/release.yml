name: Release & Multi-Arch Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-docker:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-binaries:
    name: Build Standalone Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build Matrix Binaries
        run: |
          mkdir -p dist
          TAG_NAME=${GITHUB_REF_NAME:-v2.0.0}
          
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=$TAG_NAME" -o dist/icsexplorer-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=$TAG_NAME" -o dist/icsexplorer-linux-arm64 ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=$TAG_NAME" -o dist/icsexplorer-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=$TAG_NAME" -o dist/icsexplorer-darwin-arm64 ./cmd/server
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=$TAG_NAME" -o dist/icsexplorer-windows-amd64.exe ./cmd/server

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*
          generate_release_notes: true
